[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tableextract"
version = "0.1.0"
description = "Ruled-table extraction from scanned documents: OpenCV grid detection + Tesseract OCR + optional vision-LLM refinement"
requires-python = ">=3.10"
dependencies = [
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "pytesseract>=0.3.10",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
tableextract = "tableextract.cli:main"

[tool.setuptools.packages.find]
include = ["tableextract*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
